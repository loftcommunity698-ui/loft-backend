  #   plan: starter
  #   schedule: "*/10 * * * *"
  #   buildCommand: "true"
  #   startCommand: node dist/scripts/keepalive.js
  #   envVars:
  #     - key: PING_URL
  #       value: https://loft-backend-cl1n.onrender.com/api/health